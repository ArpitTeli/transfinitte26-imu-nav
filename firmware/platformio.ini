; ESP32 firmware: IMU + wheel-encoder (+ magnetometer) fusion. Sources are copies of ../main.c.txt, ../fusion.c.txt, ../fusion.h.txt
; ESP-IDF >= 5.2 is required (driver/i2c_master.h). platform espressif32@6.9.0 ships ESP-IDF 5.3.1.
; NOTE: build from a path without an apostrophe (PlatformIO's flag parser breaks on it).
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = espidf
monitor_speed = 115200

; raw logging for IMU calibration (python log_capture.py ...): pio run -e lograw -t upload
[env:lograw]
extends = env:esp32dev
build_flags = -DLOG_RAW=1
monitor_speed = 921600
